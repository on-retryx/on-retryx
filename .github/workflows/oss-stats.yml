name: refresh open-source stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_oss.py]

permissions:
  contents: write

concurrency:
  group: oss-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull PR data and redraw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_oss.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "RetryX"
          git config user.email "351128220+on-retryx@users.noreply.github.com"
          git commit -am "Refresh open-source stats"
          git push
